[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agent"
version = "0.1.0"
description = "带确定性代码校验层的 AI 研究助手：多源检索、自主规划、结构化报告、不合格自动打回重做"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "yuanqqqqqqq" }]
keywords = ["agent", "llm", "function-calling", "react", "rag", "ai", "multi-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "zhipuai>=2.1.5",
    "python-dotenv>=1.0.0",
    "httpx>=0.27",
    "ddgs>=9.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    # zhipuai 内部 import sniffio 却没声明它（干净环境会 ModuleNotFoundError），
    # 本地不报错只是因为被 httpx/anyio 的旧版顺带装上了。这里显式补上。
    "sniffio>=1.3",
]

# 本地知识库工具（search_kb）复用你自己的 RAG 项目 my-rag（PyPI 上没有）。
# 需要时单独安装：  pip install -e ../my-rag
# 没装它也不影响研究助手的其它功能，只是 search_kb 会返回一句「请先安装 my-rag」。

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
my-agent = "research_agent.agent:main"

[tool.setuptools]
packages = ["research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
